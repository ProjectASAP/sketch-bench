[package]
name = "aqpbm-planeval"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Decodes a post-ASAP DAG, runs it over rows holding one summary per (plan, node, group), and scores each readout against the exact answer."

# Local path deps for development only. These MUST become git + rev before
# this member is committed: CI checks out sketch-bench alone, and a missing
# path dep fails manifest resolution for every member of the workspace.
[dependencies]
asap-types = { path = "../../ASAPPlanner/crates/types" }
asap-aware-mapping = { path = "../../ASAPPlanner/crates/asap-aware-mapping" }
asap-frontend-promql = { path = "../../ASAPPlanner/crates/frontend-promql" }

# 0.3.0, not the workspace pin (0.2.2): cdf_cached/quantile_cached do not
# exist before 0.3.0 and a 101-point probe grid re-sorts on every call there.
asap_sketchlib = { path = "../../asap_sketchlib", features = ["experimental"] }

aqpbm-core.workspace = true
aqpbm-datagen.workspace = true
csv.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
blake3 = "1"

[dev-dependencies]
tempfile = "3"

[package]
name = "aqpbm-planeval"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "End-to-end evaluation: feeds the same generated samples to ASAPQuery-backend (which runs ASAPPlanner's plan) and to Prometheus over Remote Write, queries both through the Prometheus HTTP API at the same evaluation times, and compares accuracy, latency and throughput."

[[bin]]
name = "planeval"
path = "src/main.rs"

# No ASAPPlanner crate in the binary: the planner and its executor run inside
# the backend's control_plane and data_plane, built from the backend's own
# lockfile at the commit in pins.env.
[dependencies]
aqpbm-datagen.workspace = true
aqpbm-core.workspace = true
anyhow.workspace = true
clap.workspace = true
csv.workspace = true
serde.workspace = true
serde_json.workspace = true
libc = "0.2"
prost = "0.13"
snap = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }

[dev-dependencies]
# examples/asapplanner_demo.rs only: ASAPPlanner on its own, planner and
# executor in process, at the rev ASAPQuery-backend pins (pins.env).
asap-planner = { git = "https://github.com/ProjectASAP/ASAPPlanner", rev = "05fb36e4e9ff0b8e2ff6d43685785117ec0b9225", default-features = false, features = ["promql"] }
asap-executor = { git = "https://github.com/ProjectASAP/ASAPPlanner", rev = "05fb36e4e9ff0b8e2ff6d43685785117ec0b9225" }
futures = "0.3"
tokio = { version = "1", features = ["rt", "macros"] }

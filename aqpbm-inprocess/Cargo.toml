[package]
name = "aqpbm-inprocess"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Runs recurring queries through ASAPPlanner's planner and executor in process, over generated samples, at every evaluation time."

[dependencies]
asap-planner = { git = "https://github.com/ProjectASAP/ASAPPlanner", rev = "41c515465646773ce04065a652f88f52bd864ce5", default-features = false, features = ["promql", "test-support"] }
asap-executor = { git = "https://github.com/ProjectASAP/ASAPPlanner", rev = "41c515465646773ce04065a652f88f52bd864ce5" }
asap-types = { git = "https://github.com/ProjectASAP/ASAPPlanner", rev = "41c515465646773ce04065a652f88f52bd864ce5" }
aqpbm-datagen.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
rand.workspace = true
rand_xoshiro.workspace = true
futures = "0.3"
tokio = { version = "1", features = ["rt", "macros"] }

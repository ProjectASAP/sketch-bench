[package]
name = "aqpbm-inprocess"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Runs recurring queries through ASAPPlanner's planner and executor in process, over generated samples, at every evaluation time."

[dependencies]
asap-planner = { git = "https://github.com/ProjectASAP/ASAPPlanner", rev = "b822553f1ea7e5fc60940dd23536d1f6c99c5334", default-features = false, features = ["test-support"] }
asap-executor = { git = "https://github.com/ProjectASAP/ASAPPlanner", rev = "b822553f1ea7e5fc60940dd23536d1f6c99c5334" }
asap-types = { git = "https://github.com/ProjectASAP/ASAPPlanner", rev = "b822553f1ea7e5fc60940dd23536d1f6c99c5334" }
asap_sketchlib = { git = "https://github.com/ProjectASAP/asap_sketchlib", rev = "a05b35ce14e4079eaa6acb29dd8c416bd1a2a3d1" }
aqpbm-datagen.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
rand.workspace = true
rand_xoshiro.workspace = true
futures = "0.3"
tokio = { version = "1", features = ["rt", "macros"] }

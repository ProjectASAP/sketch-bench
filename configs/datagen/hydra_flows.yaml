# The §6.3 eval's `flows` metric (export_autosketch_eval_table.py SCHEMAS,
# #196), for `study_saturation.py --phase hydra`. Labels in schema order, then
# the value:
#
#   dst_subnet 1000 values, Zipf 1.1
#   dst_port 1000 values, Zipf 1.2
#   proto 3 values, equally likely (#196's skew 0.0)
#   src_ip uniform over 1e6 (distinct sources)
#
# Not generated: #196's DDoS burst, where the least popular subnet (rank 999)
# gets 5% of the traffic from 1e4 distinct sources. datagen draws each column
# independently, so it cannot tie a value's sources to one label value. The
# burst subnet is one group of share >= 5% with few distinct sources; the
# study's 5%-coverage column here reads the top Zipf subnets instead.
#
#   approxbench sketchbench --variant hydra-hll --library lib \
#     --spec configs/datagen/hydra_flows.yaml --dtype i64 \
#     --config "rows=3 cols=1024" --group-columns 0 \
#     --operations query --metrics accuracy
#
# Three labels cost `2^3 - 1 = 7` cell insertions per record.

column_num: 4
column_label: [dst_subnet, dst_port, proto, src_ip]
row_num: 1000000

column_spec:
  - data_type: string
    string:
      min_len: 4
      max_len: 4
    distribution:
      kind: zipf
      skewness: 1.1
      population_size: 1000
      seed: 1

  - data_type: string
    string:
      min_len: 4
      max_len: 4
    distribution:
      kind: zipf
      skewness: 1.2
      population_size: 1000
      seed: 2

  - data_type: string
    string:
      min_len: 2
      max_len: 2
    distribution:
      kind: uniform
      lower_bound: 0.0
      upper_bound: 3.0
      seed: 3

  - data_type: i64
    distribution:
      kind: uniform
      lower_bound: 0.0
      upper_bound: 1000000.0
      seed: 4

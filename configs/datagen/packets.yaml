column_num: 7
column_label: [srcip, dstip, srcport, dstport, proto, time, pkt_len]
row_num: 20000

column_spec:
  - data_type: string
    distribution: {kind: zipf, skewness: 1.1, population_size: 256, seed: 1}
    string: {alphabet: "abcdefgh", min_len: 3, max_len: 3}

  - data_type: string
    distribution: {kind: zipf, skewness: 1.2, population_size: 512, seed: 2}
    string: {alphabet: "ijklmnop", min_len: 3, max_len: 3}

  - data_type: i64
    distribution: {kind: uniform, lower_bound: 1024.0, upper_bound: 65536.0, seed: 3}

  - data_type: i64
    distribution: {kind: zipf, skewness: 1.3, population_size: 1024, seed: 4}

  - data_type: string
    distribution: {kind: uniform, lower_bound: 0.0, upper_bound: 3.0, seed: 5}
    string: {alphabet: "tuv", min_len: 1, max_len: 1}

  - data_type: f64
    special_rule: 1
    shift: 1526562600.0
    distribution: {kind: uniform, lower_bound: 0.0, upper_bound: 0.002, seed: 6}

  - data_type: i64
    distribution: {kind: uniform, lower_bound: 40.0, upper_bound: 1500.0, seed: 7}

# A multi-column table for the record-ingesting rows (the `hydra-*` algorithms):
# the last column is the value and the ones before it are labels. Each column
# carries its own distribution, parameters and seed, so its cardinality, skew and
# draw are steered independently.
#
# Label columns render as text, so their `data_type` is `string`; the value
# column's `data_type` is the row's item type. That is why `hydra-kll`, whose
# value is `f64`, reads `hydra_columns_f64.yaml` instead — one file states one
# value type, and a description that disagreed with the row would be coerced
# rather than honoured.
#
#   approxbench sketchbench --variant hydra-cms --library lib \
#     --spec configs/datagen/hydra_columns.yaml \
#     --config "rows=3 cols=1024 cell_rows=3 cell_cols=1024" \
#     --operations query --metrics accuracy
#
#   approxbench sketchbench --variant hydra-hll --library lib \
#     --spec configs/datagen/hydra_columns.yaml \
#     --config "rows=3 cols=1024" --operations query --metrics accuracy
#
# Swap `--library lib` for `--library polars` to get the exact answer to the same
# question, through the same machinery. That row is what tells you how much of
# a reported error is the sketch.
#
# Two things worth knowing before reading the numbers.
#
# A record is written into every non-empty subset of its labels, so `d` labels
# cost `2^d - 1` cell insertions. At the two label columns below that is 3.
# Reported throughput is records per second, which is the denominator that stays
# comparable as `d` changes.
#
# The columns here share the default alphabet, so their value domains overlap: a
# query for label `"abc"` cannot distinguish the key1 group from the key2 group,
# and the estimate absorbs both. This is #74, and it is the reason the `polars`
# rows do not score zero on this file. Give each column its own
# `string.alphabet` to make the domains disjoint, and the baselines drop to
# exactly zero.

column_num: 3
column_label: [key1, key2, value]
row_num: 200000

column_spec:
  # key1: the column the comparator groups by.
  - data_type: string
    distribution:
      kind: uniform
      lower_bound: 0.0
      upper_bound: 200.0
      seed: 1

  # key2: a second label, skewed, so the subset fan-out is not uniform.
  - data_type: string
    distribution:
      kind: zipf
      skewness: 1.1
      population_size: 50
      seed: 2

  # value: what the cells hold inside each subpopulation. Count-Min counts its
  # occurrences, HyperLogLog counts how many of it are distinct.
  - data_type: i64
    distribution:
      kind: zipf
      skewness: 1.2
      population_size: 1000
      seed: 3

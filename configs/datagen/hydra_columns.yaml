# A multi-column stream for the record-ingesting rows (the `hydra-*`
# algorithms): a list of specs, where the last column is the value and the ones
# before it are labels. Each column is an ordinary single-column spec, so its
# cardinality, skew and seed are steered independently.
#
# All three Hydra algorithms read this one file. The cell type is on the
# algorithm axis, so which statistic you get is chosen by `--algorithm`:
#
#   approxbench sketchbench --algorithm hydra-cms --impl lib \
#     --spec configs/datagen/hydra_columns.yaml \
#     --config "rows=3 cols=1024 cell_rows=3 cell_cols=1024" --accuracy
#
#   approxbench sketchbench --algorithm hydra-hll --impl lib \
#     --spec configs/datagen/hydra_columns.yaml \
#     --config "rows=3 cols=1024" --accuracy
#
#   approxbench sketchbench --algorithm hydra-kll --impl lib \
#     --spec configs/datagen/hydra_columns.yaml \
#     --config "rows=3 cols=1024 cell_k=200" --accuracy
#
# `hydra-kll` reads the value column as `f64` and the other two read it as
# `i64`. The column spec is the same either way; only the rendering differs.
#
# Swap `--impl lib` for `--impl polars` to get the exact answer to the same
# question, through the same machinery. That row is what tells you how much of
# a reported error is the sketch.
#
# Two things worth knowing before reading the numbers.
#
# A record is written into every non-empty subset of its labels, so `d` labels
# cost `2^d - 1` cell insertions. At the two label columns below that is 3.
# Reported throughput is records per second, which is the denominator that stays
# comparable as `d` changes.
#
# The label columns take disjoint alphabets, and that is what makes the `polars`
# rows score exactly zero here. A depth-1 subset key is the bare label string,
# carrying nothing that says which column it came from, so two label columns
# drawing the same string put two populations in one cell and a query for that
# string cannot tell them apart. Sharing an alphabet does not risk this, it
# guarantees it: `keys` renders a rank through a fixed positional encoding, so
# rank `i` is always the same string, and key2's 50 labels would be key1's first
# 50 exactly. Measured at `rows=3 cols=1024 cell_rows=3 cell_cols=1024`, that
# put the exact `hydra-cms` baseline at `are_all = 0.586` and the sketch at
# 0.749, so four fifths of the sketch's apparent error was the key space.
#
# Every character a key is built from comes from its column's alphabet, prefix
# and filler alike, so partitioning the character set makes an equal string
# impossible instead of unlikely. The two halves below are the default alphabet
# cut in two. That leaves the rank encoding untouched: at cardinality 200 and 50
# the prefix is 2 characters under base 36 and still 2 under base 18, and key
# length is derived from the rank alone, so lengths and per-column distributions
# are what they were before the split. Only which characters appear changes.

# key1: the column the comparator groups by.
- shape: keys
  cardinality: 200
  dist:
    kind: uniform
  size: 200000
  seed: 1
  string:
    alphabet: "abcdefghijklmnopqr"

# key2: a second label, skewed, so the subset fan-out is not uniform.
- shape: keys
  cardinality: 50
  dist:
    kind: zipf
    s: 1.1
  size: 200000
  seed: 2
  string:
    alphabet: "stuvwxyz0123456789"

# value: what the cells hold inside each subpopulation. Count-Min counts its
# occurrences, HyperLogLog counts how many of it are distinct, KLL orders it.
- shape: keys
  cardinality: 1000
  dist:
    kind: zipf
    s: 1.2
  size: 200000
  seed: 3

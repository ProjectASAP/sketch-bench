# Finite-domain skewed-categorical: a handful of "OS type" ids that
# recur, with an explicit heavy skew toward the common ones.
# Generate with:
#   approxbench workload generate --spec configs/datagen/os_types.yaml --out input/os_types.bin
shape: categorical
categories: [0, 1, 2, 3, 4, 5, 6, 7]
dist:
  kind: explicit
  weights: [40.0, 25.0, 15.0, 8.0, 5.0, 3.0, 2.0, 2.0]
size: 1000000
seed: 42

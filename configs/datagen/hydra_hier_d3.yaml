# `hydra_hier.yaml` cut to 3 labels (region, service, endpoint), for the Hydra
# study's schema-width sweep: `2^3 - 1 = 7` cell insertions per record.
# Same columns, distributions and seeds as `hydra_hier.yaml`, which has 4 labels.

column_num: 4
column_label: [region, service, endpoint, user_id]
row_num: 200000

column_spec:
  # region: 4 values, equally likely.
  - data_type: string
    string:
      min_len: 4
      max_len: 4
    distribution:
      kind: uniform
      lower_bound: 0.0
      upper_bound: 4.0
      seed: 1

  # service: 25 per region, skewed, so a few services carry most traffic.
  - data_type: string
    child_of: 0
    fan_out: 25
    distribution:
      kind: zipf
      skewness: 1.1
      population_size: 25
      seed: 2

  # endpoint: 25 per service, skewed.
  - data_type: string
    child_of: 1
    fan_out: 25
    distribution:
      kind: zipf
      skewness: 1.2
      population_size: 25
      seed: 3

  # user_id: the value. Count-Min counts its occurrences per group,
  # HyperLogLog counts how many are distinct.
  - data_type: i64
    distribution:
      kind: zipf
      skewness: 0.8
      population_size: 1000000
      seed: 5

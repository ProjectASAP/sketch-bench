# `hydra_columns_f64.yaml` with a separate alphabet per label column, so a key1
# value can never render the same as a key2 value (#74). The sketch keys each
# subset by column (asap_sketchlib 0.3.0), so it doesn't need this; the
# `polars` baseline still builds untagged subset keys, and on the shared
# alphabet it merges a key1 group with the matching key2 group. Here the
# baseline scores zero and any rank error is the sketch's. `export_rqe_optimizer_costs.sh` priced `hydra-kll` on it
# until #174; HydraKLL has no saturation curve, so nothing measures it now.

column_num: 3
column_label: [key1, key2, value]
row_num: 200000

column_spec:
  # key1: the column the comparator groups by.
  - data_type: string
    distribution:
      kind: uniform
      lower_bound: 0.0
      upper_bound: 200.0
      seed: 1
    string: {alphabet: "abcdefghijklm"}

  # key2: a second label, skewed, so the subset fan-out is not uniform.
  - data_type: string
    distribution:
      kind: zipf
      skewness: 1.1
      population_size: 50
      seed: 2
    string: {alphabet: "nopqrstuvwxyz"}

  # value: KLL orders these inside each subpopulation.
  - data_type: f64
    distribution:
      kind: zipf
      skewness: 1.2
      population_size: 1000
      seed: 3

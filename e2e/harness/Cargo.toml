[package]
name = "aqpbm-e2e"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "End-to-end comparison of ASAPQuery-backend against Prometheus: generates samples, writes them to both over Remote Write, plans with the backend's control_plane, and queries both through the Prometheus HTTP API at the same evaluation times."

[[bin]]
name = "aqpbm-e2e"
path = "src/main.rs"

# No ASAPPlanner crate here: the planner runs inside the backend's
# control_plane and data_plane binaries, built from their own lockfile at the
# commit in e2e/pins.env.
[dependencies]
aqpbm-datagen.workspace = true
aqpbm-core.workspace = true
anyhow.workspace = true
clap.workspace = true
csv.workspace = true
serde.workspace = true
serde_json.workspace = true
libc = "0.2"
prost = "0.13"
snap = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }

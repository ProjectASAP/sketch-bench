# Workspace manifest for sketch-bench → sketchlib-tool.
[workspace]
resolver = "2"
members = [
    "aqpbm-datagen",
    "aqpbm-core",
    "sketch-bench",
    "aqpbm-cli",
    "aqpbm-planeval",
    "rqe-optimizer",
]

exclude = ["sketch-runtime"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ProjectASAP/sketch-bench"

[workspace.dependencies]
# Serde + JSON for the report schema (`aqpbm_core::report`).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"

schemars = { version = "1", features = ["chrono04"] }

# Time / stats.
chrono = { version = "0.4", features = ["serde"] }
hdrhistogram = "7"
csv = "1"
flate2 = "1"

# Memory metrics (opt-in via feature).
tikv-jemalloc-ctl = { version = "0.7", features = ["stats"] }
tikv-jemallocator = "0.7"

# RNG for workload generators.
rand = "0.9"
rand_distr = "0.5"
rand_xoshiro = "0.7"

clap = { version = "4", features = ["derive", "wrap_help"] }

# Errors.
thiserror = "2"
anyhow = "1"

# Bitflags for MetricsMask.
bitflags = "2"

# Sketch impls used by the 21 wrappers.
polars = { version = "0.46", features = ["lazy", "ipc", "ipc_streaming"] }
sketch_oxide = "0.1.6"
datasketches = "0.2.0"
asap_sketchlib = { version = "0.2.2", features = ["experimental"] }

# Internal workspace crates.
aqpbm-datagen = { path = "aqpbm-datagen" }
aqpbm-core = { path = "aqpbm-core", default-features = false }
sketch-bench = { path = "sketch-bench" }
rqe-optimizer = { path = "rqe-optimizer" }
# sketch-runtime = { path = "sketch-runtime" }  # parked;

[profile.release]
opt-level = 3
# thin LTO + codegen-units=1 keeps each crate's specializations
# intact across the cross-crate inline boundary. Combined with
# asap_sketchlib >= 0.2.2 (which marks its fast-path matrix hash
# entry #[inline(always)] so rows/cols literals propagate into the
# Packed64 fold), this is enough to keep the FixedMatrix FastPath
# hot loop fully unrolled in this monolithic binary without PGO.
# Historical PGO machinery is archived under scripts/archive/
# and docs/archive/PGO.md.
lto = "thin"
codegen-units = 1
panic = "abort"

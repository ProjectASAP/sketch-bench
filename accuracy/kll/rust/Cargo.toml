[package]
name = "kll_accuracy"
version = "0.1.0"
edition = "2021"

[dependencies]
asap_sketchlib = { path = "../../../../asap_sketchlib" }
sketch_oxide = "0.1.5"
sketch-bench = { path = "../../../sketch-bench" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Keeps this crate out of the top-level `sketchlib-bench` workspace
# while still allowing a path dep into `sketch-bench`.
[workspace]

[package]
name = "aqpbm-engines-external"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Runs ASAPPlanner plan files on external engines: reads an InstallablePlan file (wire version 15) and translates it into ClickHouse materialized views and SQL. The translator is the capability check: a node it has no rule for is refused. Depends on no ASAPPlanner crate."

[dependencies]
aqpbm-core.workspace = true
serde_json.workspace = true
ureq = { version = "2", default-features = false }
thiserror.workspace = true

ory</text><rect x="350" y="230" width="108" height="12" rx="3" fill="#eaeef2" stroke="none" stroke-width="1.5"/><rect x="350" y="230" width="99.36" height="12" rx="3" fill="#cf222e" stroke="none" stroke-width="1.5"/><text x="404" y="284" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#cf222e" text-anchor="middle">memory leak</text><rect x="354" y="320" width="100" height="26" rx="13" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><text x="404" y="337" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1a7f37" text-anchor="middle">more memory</text><rect x="484" y="124" width="136" height="186" rx="8" fill="#ffffff" stroke="#8250df" stroke-width="1.5"/><text x="552" y="150" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#8250df" text-anchor="middle">Idle</text><text x="552" y="168" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#59636e" text-anchor="middle">20 containers</text><text x="498" y="190" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#59636e" text-anchor="start">CPU</text><rect x="498" y="196" width="108" height="12" rx="3" fill="#eaeef2" stroke="none" stroke-width="1.5"/><rect x="498" y="196" width="16.2" height="12" rx="3" fill="#0969da" stroke="none" stroke-width="1.5"/><text x="498" y="224" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#59636e" text-anchor="start">Memory</text><rect x="498" y="230" width="108" height="12" rx="3" fill="#eaeef2" stroke="none" stroke-width="1.5"/><rect x="498" y="230" width="21.6" height="12" rx="3" fill="#0969da" stroke="none" stroke-width="1.5"/><text x="552" y="284" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#8250df" text-anchor="middle">barely used</text><rect x="502" y="320" width="100" height="26" rx="13" fill="#dafbe1" stroke="#1a7f37" stroke-
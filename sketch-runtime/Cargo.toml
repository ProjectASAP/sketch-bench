[package]
name = "sketch-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Embedded sketch-benchmark layer — `Sampler` + `Exporter` so downstream apps (asap-fusion, DataCollector, ASAPQuery) can always-on report sketch metrics to ASAPController using the v1 JSONL schema from aqpbm-core."
build = "build.rs"

[features]
# Turn `Sampler` into a real sampler with mode dispatch + exporter
# I/O. `default-features = false` makes `Sampler` a ZST alias of
# `NoopSink` — compile-time off with zero binary / runtime cost.
default = ["enabled", "grpc"]
enabled = []
# gRPC streaming exporter talking to the ASAPController's
# RuntimeSamples service. Pulls in tonic + prost; the client
# negotiates gzip compression on the wire via HTTP/2.
grpc = ["dep:tonic", "dep:prost", "dep:tokio"]

[dependencies]
# aqpbm-core only. This crate deliberately does NOT depend on
# sketch-bench: it is linked into always-on downstream apps
# (DataCollector, asap-fusion), and the offline benchmark library
# — runner, baselines, accuracy comparators, jemalloc-ctl — has
# no business in that binary. See docs/DESIGN.md §3.1.
aqpbm-core = { workspace = true, features = ["hdrhist"] }
serde.workspace = true
serde_json.workspace = true
tonic = { version = "0.12", features = ["gzip"], optional = true }
prost = { version = "0.13", optional = true }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"], optional = true }

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
criterion = "0.5"
tempfile = "3.20.0"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.12"
prost = "0.13"

[[bench]]
name = "sampler_overhead"
harness = false

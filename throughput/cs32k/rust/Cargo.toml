[package]
name = "cs32k_throughput"
version = "0.1.0"
edition = "2021"

[dependencies]
sketch_oxide = "0.1.6"
asap_sketchlib = { path = "../../../../asap_sketchlib" }
twox-hash = "2.1.2"

[[bin]]
name = "cs32k_throughput"
path = "src/main.rs"

[[bin]]
name = "cs32k_throughput_query"
path = "src/bin/query.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

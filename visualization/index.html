<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sketch Benchmarks Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .landing-container {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .landing-title {
      font-size: 3rem;
      margin-bottom: 1rem;
      text-align: center;
    }

    .landing-subtitle {
      font-size: 1.2rem;
      color: #9ca3af;
      margin-bottom: 3rem;
      text-align: center;
    }

    .view-options {
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .view-card {
      background: #020617;
      border: 2px solid #1f2937;
      border-radius: 16px;
      padding: 2rem;
      width: 280px;
      text-align: center;
      cursor: pointer;
      transition: all 200ms ease;
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .view-card:hover {
      border-color: #2563eb;
      transform: translateY(-4px);
      box-shadow: 0 20px 40px rgba(37, 99, 235, 0.2);
    }

    .view-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    .view-title {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .view-description {
      font-size: 0.95rem;
      color: #9ca3af;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card landing-container">
      <h1 class="landing-title">Sketch Benchmarks</h1>
      <p class="landing-subtitle">
        Choose your view: explore raw data or visualize performance metrics
      </p>

      <div class="view-options">
        <a href="tables.html" class="view-card">
          <div class="view-icon">📊</div>
          <div class="view-title">Data Tables</div>
          <div class="view-description">
            View detailed benchmark results in responsive tables. Upload JSON files or browse auto-loaded data.
          </div>
        </a>

        <a href="charts.html" class="view-card">
          <div class="view-icon">📈</div>
          <div class="view-title">Visualizations</div>
          <div class="view-description">
            Interactive bar charts showing median performance metrics for each benchmark.
          </div>
        </a>
      </div>
    </div>
  </div>
</body>
</html>

[package]
name = "sketch-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Macro-metric benchmark library for sketch algorithms (throughput, latency, CPU, memory, accuracy) — see docs/DESIGN.md §5."

[features]
default = ["hdrhist"]
# Enable the hdrhistogram-backed latency recorder. Off → the
# LATENCY mask bit is a no-op that costs nothing. The recorder
# itself lives in aqpbm-core now; this forwards.
hdrhist = ["aqpbm-core/hdrhist"]
# Enable tikv-jemalloc-ctl `stats.allocated` sampling. Forces
# jemalloc on the linking binary — opt-in only. Off →
# heap_allocated_kb = None. The sampler lives in aqpbm-core now;
# this forwards.
heap-jemalloc = ["aqpbm-core/heap-jemalloc"]
# Compile in the per-sketch tracking allocator. The recorder lives
# in aqpbm-core now; this forwards. The linking binary still has to
# install `TrackingAllocator` as its `#[global_allocator]` for
# counters to advance — see `aqpbm-cli`'s allocator setup. Off →
# heap_bytes_* = None.
heap-track = ["aqpbm-core/heap-track"]

[dependencies]
# Fixed-seed shuffle of the probe set, so probe order is reproducible.
rand = { workspace = true }
rand_xoshiro = { workspace = true }
aqpbm-core.workspace = true
# `cell`'s `WorkloadSpec`/`Items` build workloads through the one
# generator; `DType` also tags a row's item type.
aqpbm-datagen.workspace = true
# `cell::run_cell` / `catalog::run` surface "cannot run this cell" as an
# `anyhow` error.
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true

# The wrapped implementations under test. They arrived with `wrappers/`:
# a benchmark for the sketch domain owns the sketches it measures, the
# same way it already owned the exact baselines they are compared against.
sketch_oxide.workspace = true
datasketches.workspace = true
asap_sketchlib.workspace = true
# DataFrame-engine baselines (hll/cms/kll/dd `polars` impls).
polars = { version = "0.46", features = ["lazy"] }

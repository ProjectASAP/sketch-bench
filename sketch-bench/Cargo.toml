[package]
name = "sketch-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Macro-metric benchmark library for sketch algorithms (throughput, latency, CPU, memory, accuracy) — see docs/DESIGN.md §5."

[features]
default = ["hdrhist", "accuracy-topk"]
# Enable the hdrhistogram-backed latency recorder. Off → the
# LATENCY mask bit is a no-op that costs nothing. The recorder
# itself lives in aqpbm-core now; this forwards.
hdrhist = ["aqpbm-core/hdrhist"]
# Enable tikv-jemalloc-ctl `stats.allocated` sampling. Forces
# jemalloc on the linking binary — opt-in only. Off →
# heap_allocated_kb = None.
heap-jemalloc = ["dep:tikv-jemalloc-ctl"]
# Compile in the per-sketch tracking allocator (heap_track.rs).
# The linking binary still has to install `TrackingAllocator` as
# its `#[global_allocator]` for counters to advance — see
# `aqpbm-cli`'s allocator setup. Off → heap_bytes_* = None.
heap-track = []
# Pull the HashMap-based top-k ground-truth comparator.
accuracy-topk = []

[dependencies]
# Fixed-seed shuffle of the probe set, so probe order is reproducible.
rand = { workspace = true }
rand_xoshiro = { workspace = true }
aqpbm-core.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
hashbrown.workspace = true
thiserror.workspace = true
tikv-jemalloc-ctl = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[package]
name = "aqpbm-datagen"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Synthetic data generator for the AQPBM benchmarks: a table description in, typed in-memory columns out. Distribution, special rule, rendering and cross-column relation are separable axes. Depends on nothing in the workspace and knows nothing about sketches -- the sketch benchmark is its first consumer, not its owner."

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
rand.workspace = true
rand_distr.workspace = true
rand_xoshiro.workspace = true
thiserror.workspace = true

[package]
name = "sketch-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Unified `sketchlib` CLI: `bench` + `profile` + `workload` subcommands over every sketch impl in the repo."

[[bin]]
name = "sketchlib"
path = "src/main.rs"

[features]
default = ["heap-jemalloc"]
# When on, sketchlib links jemalloc as its global allocator and
# sketch-bench samples `tikv-jemalloc-ctl::stats::allocated` into
# `bench.heap_allocated_kb`. Turn off with `--no-default-features`
# to fall back to the system allocator (heap_allocated_kb then
# reports as absent in the JSONL record).
heap-jemalloc = ["sketch-bench/heap-jemalloc", "dep:tikv-jemallocator"]

[dependencies]
sketch-core.workspace = true
sketch-bench.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
rand.workspace = true
rand_xoshiro.workspace = true
tikv-jemallocator = { workspace = true, optional = true }

# Every wrapped sketch implementation.
sketch_oxide.workspace = true
datasketches.workspace = true
asap_sketchlib.workspace = true

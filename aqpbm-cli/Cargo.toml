[package]
name = "aqpbm-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Unified `approxbench` CLI: `sketchbench` + `workload` subcommands over every sketch impl in the repo."

[[bin]]
name = "approxbench"
path = "src/main.rs"

[features]
default = ["heap-jemalloc"]
# When on, approxbench links jemalloc as its global allocator and
# sketch-bench samples `tikv-jemalloc-ctl::stats::allocated` into
# `bench.heap_allocated_kb`. Turn off with `--no-default-features`
# to fall back to the system allocator (heap_allocated_kb then
# reports as absent in the JSONL record).
heap-jemalloc = ["sketch-bench/heap-jemalloc", "dep:tikv-jemallocator"]
# Wraps the global allocator in a counting shim so the runner can
# attribute heap usage to a specific sketch's lifetime. Composes
# with `heap-jemalloc` (then jemalloc is the inner allocator).
# `TrackingAllocator` now lives in aqpbm-core (the CLI installs it
# as `#[global_allocator]` directly), so enable it there too.
heap-track = ["sketch-bench/heap-track", "aqpbm-core/heap-track"]

[dependencies]
aqpbm-datagen.workspace = true
aqpbm-core.workspace = true
sketch-bench.workspace = true
clap.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tikv-jemallocator = { workspace = true, optional = true }

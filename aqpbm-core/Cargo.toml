[package]
name = "aqpbm-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The benchmark framework: everything needed to measure a sketch, nothing that knows which sketches exist. Turns a row's build/insert/ask closures into timed bodies (ops), holds the clock (measure), scores against exact answers (accuracy), materialises datasets, and owns the JSONL report schema. Names no sketch algorithm — the wrapped implementations live in sketch-bench."

[features]
# Back the `LatencyRecorder` with a real hdrhistogram. Off → it
# is a counter-only shim and `hdrhistogram` is not linked. On by
# default so `sketch-bench` and `sketch-runtime` behave as they
# did when the recorder lived in `sketch-bench`; embedded
# consumers that want neither can take aqpbm-core with
# `default-features = false`.
default = ["hdrhist"]
hdrhist = ["dep:hdrhistogram"]
# Enable tikv-jemalloc-ctl `stats.allocated` sampling in the
# `memory` recorder. Forces jemalloc on the linking binary —
# opt-in only. Off → heap_allocated_kb = None.
heap-jemalloc = ["dep:tikv-jemalloc-ctl"]
# Compile in the per-sketch tracking allocator (metrics/heap_track.rs).
# The linking binary still has to install `TrackingAllocator` as
# its `#[global_allocator]` for counters to advance — see
# `aqpbm-cli`'s allocator setup. Off → heap_bytes_* = None.
heap-track = []

[dependencies]
aqpbm-datagen.workspace = true
# `dataset` surfaces "cannot materialise this dataset" as an `anyhow` error,
# which `RunError::Dataset` carries.
anyhow.workspace = true
bitflags.workspace = true
hdrhistogram = { workspace = true, optional = true }
# Fixed-seed shuffle of the frequency comparator's probe set, so probe
# order is reproducible.
rand = { workspace = true }
rand_xoshiro = { workspace = true }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tikv-jemalloc-ctl = { workspace = true, optional = true }

# `metrics::time` reads CPU time via `getrusage`.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
